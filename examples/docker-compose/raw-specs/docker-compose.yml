services:
  mockzilla:
    image: mockzilla/mockzilla:latest
    ports:
      - "2200:2200"
    volumes:
      # Mount the per-service tree at /data/services. The optional
      # app.yml lives at the same level (`/data/app.yml`).
      - ./services:/data/services:ro
      - ./app.yml:/data/app.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2200/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Example: your application that uses the mock server
  # app:
  #   build: ./your-app
  #   environment:
  #     - API_BASE_URL=http://mockzilla:2200
  #   depends_on:
  #     mockzilla:
  #       condition: service_healthy
