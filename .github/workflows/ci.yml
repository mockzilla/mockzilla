name: CI

# No paths-ignore here on purpose. main requires fetch-specs, linter,
# linter-openapi, test and prepare-integration-matrix, and a workflow
# skipped by a path filter reports nothing at all, so those checks sit
# at "Expected - Waiting for status to be reported" and the pull
# request can never merge. A job skipped by `if:` does report, and a
# skipped check satisfies the requirement. So the filtering lives in
# the `changes` job below and every required job keys off it.
on:
  push:
    branches: 'main'
  pull_request:
    branches: '**'

permissions: read-all

jobs:
  # Does this change touch anything that can affect the build? Paths
  # listed here are documentation only; everything else counts as code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Look for non-documentation changes
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A first push or a force push can leave no usable base; when
          # in doubt run the full suite rather than skip it.
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base commit, running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${BASE}" "${HEAD}")
          echo "Changed files:"
          echo "${changed}"
          code=$(echo "${changed}" | grep -vE '^docs/|\.md$|^mkdocs\.yml$|^LICENSE$' || true)
          if [ -n "${code}" ]; then
            echo "Non-documentation changes present, running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation-only change, skipping the build jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  fetch-specs:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cache specs
        id: cache-specs
        uses: actions/cache@v4
        with:
          path: testdata/specs
          key: specs-${{ hashFiles('Makefile') }}
      - name: Fetch specs
        if: steps.cache-specs.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: make fetch-specs
      - name: Upload specs artifact
        uses: actions/upload-artifact@v4
        with:
          name: specs
          path: testdata/specs
          retention-days: 1

  linter:
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    needs: [changes, fetch-specs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download specs artifact
        uses: actions/download-artifact@v4
        with:
          name: specs
          path: testdata/specs
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1
          args: --timeout 10m

  linter-openapi:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch PR head
        run: git fetch origin ${{ github.event.pull_request.head.sha }}
      - name: Lint OpenAPI spec
        uses: github/super-linter@v7
        env:
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_OPENAPI: true
          FILTER_REGEX_INCLUDE: resources/openapi.yml

  test:
    needs: [changes, fetch-specs]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download specs artifact
      uses: actions/download-artifact@v4
      with:
        name: specs
        path: testdata/specs

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25.7"

    - name: Build
      run: go build -v ./...

    - run: go mod download && go mod tidy && go mod verify
    - run: git --no-pager diff --exit-code

    - run: go vet ./...
    - run: git --no-pager diff --exit-code

    - run: go fmt ./...
    - run: git --no-pager diff --exit-code

    - name: Check make generate produces no diff
      run: |
        make generate
        git --no-pager diff --exit-code

    - name: Unit tests
      run: make test-with-check-coverage

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: coverage.out

  prepare-integration-matrix:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up matrix
      id: set-matrix
      run: |
        # Read specs from file, skip comments and empty lines, split into 4 batches
        specs=$(grep -v '^#' .github/ci-specs.txt | grep -v '^$' | tr '\n' ' ')
        specs_array=($specs)
        total=${#specs_array[@]}
        batch_size=$(( (total + 3) / 4 ))

        matrix='{"include":['
        for i in 0 1 2 3; do
          start=$((i * batch_size))
          batch_specs=""
          for j in $(seq $start $((start + batch_size - 1))); do
            if [ $j -lt $total ]; then
              batch_specs="$batch_specs ${specs_array[$j]}"
            fi
          done
          if [ -n "$batch_specs" ]; then
            matrix="$matrix{\"batch\":$((i+1)),\"specs\":\"$batch_specs\"},"
          fi
        done
        matrix="${matrix%,}]}"
        echo "matrix=$matrix" >> $GITHUB_OUTPUT

  integration-test:
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    needs: [changes, fetch-specs, prepare-integration-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-integration-matrix.outputs.matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download specs artifact
      uses: actions/download-artifact@v4
      with:
        name: specs
        path: testdata/specs

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25.7"

    - name: Integration Tests (Batch ${{ matrix.batch }})
      run: |
        NO_CACHE=1 SPECS="${{ matrix.specs }}" make test-integration
