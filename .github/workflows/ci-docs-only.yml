name: CI (docs only)

# The ruleset on main requires fetch-specs, linter, linter-openapi,
# test and prepare-integration-matrix. CI skips documentation-only
# changes, so without this those checks are never reported and the pull
# request waits on them forever: "Expected - Waiting for status to be
# reported". These jobs report the same names for exactly the changes
# CI ignores, and only for those changes.
#
# `paths` here must mirror `paths-ignore` in ci.yml. A path in one list
# and not the other either blocks pull requests forever or lets code
# through unchecked, so the two lists are edited together or not at all.
#
# A pull request touching both docs and code triggers both workflows.
# That is fine: these jobs finish in seconds and the real run reports
# the same check names minutes later, so its result is the one that
# stands.

on:
  pull_request:
    branches: '**'
    paths:
      - 'docs/**'
      - '**.md'
      - 'mkdocs.yml'
      - 'LICENSE'

permissions: read-all

jobs:
  fetch-specs:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Documentation-only change: no specs to fetch."'

  linter:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Documentation-only change: no Go code to lint."'

  linter-openapi:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Documentation-only change: no OpenAPI spec to lint."'

  test:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Documentation-only change: no tests to run."'

  prepare-integration-matrix:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Documentation-only change: no integration matrix needed."'
