name: mockzilla
base: core22
version: '__VERSION__'
summary: Generate API mocks with meaningful responses, latency, error codes
description: |
  Mockzilla is an OpenAPI mock engine that generates API mocks with meaningful
  responses, configurable latency, error codes and more.

  See https://mockzilla.github.io/mockzilla/ for full documentation.
license: MIT
grade: stable
confinement: strict
source-code: https://github.com/mockzilla/mockzilla
issues: https://github.com/mockzilla/mockzilla/issues
website: https://mockzilla.github.io/mockzilla/

architectures:
  - build-on: amd64
  - build-on: arm64

parts:
  mockzilla:
    plugin: nil
    build-packages:
      - curl
    override-build: |
      set -e
      ARCH=$(dpkg --print-architecture)
      case "$ARCH" in
        amd64|arm64) GOARCH=$ARCH ;;
        *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
      esac
      URL="https://github.com/mockzilla/mockzilla/releases/download/v__VERSION__/mockzilla-v__VERSION__-linux-${GOARCH}"
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      curl -fsSL "$URL" -o "$CRAFT_PART_INSTALL/bin/mockzilla"
      chmod +x "$CRAFT_PART_INSTALL/bin/mockzilla"

apps:
  mockzilla:
    command: bin/mockzilla
    plugs:
      - network
      - network-bind
      - home
      - removable-media
