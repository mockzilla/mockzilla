# yaml-language-server: $schema=https://raw.githubusercontent.com/mockzilla/mockzilla-codegen/main/config.schema.json
package: {{.PackageName}}
models:
  int-type: int64
  descriptions: false
  validation:
    response: true
server:
  framework: chi
  validation:
    request: {{if eq .ServiceType "static"}}false{{else}}true{{end}}
    response: false
  scaffold:
    service: ../service.go
output:
  file: ../gen.go
