openapi: 3.0.0
info: { title: t, version: "1" }
paths:
  /cf:
    get:
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Leaf'
components:
  schemas:
    Root:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
    Item:
      allOf:
        - $ref: '#/components/schemas/Root'
        - type: object
          properties:
            color:
              type: string
            enabled:
              type: boolean
            name:
              type: string
    Inner:
      allOf:
        - $ref: '#/components/schemas/Root'
        - type: object
          properties:
            enum_options:
              type: array
              items:
                $ref: '#/components/schemas/Item'
            multi_enum_values:
              type: array
              items:
                $ref: '#/components/schemas/Item'
    Middle:
      allOf:
        - $ref: '#/components/schemas/Inner'
        - type: object
          properties:
            extra:
              type: string
            enum_options:
              type: array
              items:
                $ref: '#/components/schemas/Item'
    Leaf:
      allOf:
        - $ref: '#/components/schemas/Middle'
        - type: object
          properties:
            note:
              type: string
